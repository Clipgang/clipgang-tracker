name: Clip schneiden

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Twitch-Clip-Link"
        required: true
      hook:
        description: "Hook-Text (max. 5-6 Woerter + 1 Emoji)"
        required: false
        default: ""
      streamer:
        description: "Streamer-Name (leer = aus dem Link)"
        required: false
        default: ""
      layout:
        description: "Layout"
        type: choice
        options: [standard, facecam]
        default: standard
      facecam:
        description: "Nur bei Layout facecam: unten-rechts, unten-links, oben-rechts, oben-links oder x,y,b,h in Prozent (leer = gespeicherter Wert)"
        required: false
        default: ""
      untertitel:
        description: "Untertitel in der Bildmitte (Hook wandert nach oben)"
        type: boolean
        default: false
      start:
        description: "Start: 0, Sekunde oder auto (= kurz vor der lautesten Stelle)"
        required: false
        default: "0"
      teile:
        description: "In wie viele Teile schneiden"
        type: choice
        options: ["1", "2"]
        default: "1"

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Whisper-Modell aus dem Cache holen
        if: inputs.untertitel
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install --quiet -r .github/requirements-schnitt.txt
      - name: Clip schneiden
        id: load
        env:
          LINK: ${{ inputs.link }}
          HOOK: ${{ inputs.hook }}
          STREAMER: ${{ inputs.streamer }}
          LAYOUT: ${{ inputs.layout }}
          FACECAM: ${{ inputs.facecam }}
          UNTERTITEL: ${{ inputs.untertitel }}
          START: ${{ inputs.start }}
          TEILE: ${{ inputs.teile }}
        run: |
          export AUFTRAG=$(python -c 'import json,os; e=os.environ; print(json.dumps({"format":"einzel","link":e["LINK"],"hook":e["HOOK"],"streamer":e["STREAMER"],"layout":e["LAYOUT"],"facecam":e["FACECAM"],"untertitel":e["UNTERTITEL"]=="true","start":e["START"] or "0","teile":int(e["TEILE"] or 1)}))')
          python auftrag.py
          ls -la fertig
      - uses: actions/upload-artifact@v4
        with:
          name: fertiger-clip
          path: fertig/
          retention-days: 3
      - name: Vorschaubilder speichern
        if: always()
        run: |
          ls vorschau_tmp/*.jpg > /dev/null 2>&1 || exit 0
          cp vorschau_tmp/*.jpg "$RUNNER_TEMP"/
          git config user.name "clipgang-bot"
          git config user.email "clipgang-bot@users.noreply.github.com"
          if git fetch -q --depth 1 origin vorschau; then
            git checkout -q -B vorschau FETCH_HEAD
          else
            git checkout -q --orphan vorschau
            git rm -rfq --cached . > /dev/null
          fi
          mkdir -p vorschau
          cp "$RUNNER_TEMP"/*.jpg vorschau/
          ls -t vorschau/*.jpg | tail -n +41 | xargs -r rm -f
          git add -A vorschau
          git commit -qm "Vorschau ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do
            git push -q origin vorschau && break
            sleep 3
            git pull -q --rebase origin vorschau
          done
