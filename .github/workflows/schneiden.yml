name: Clip schneiden

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Twitch-Clip-Link"
        required: true
      hook:
        description: "Hook-Text oben (max. ~8 Woerter)"
        required: false
        default: ""
      streamer:
        description: "Streamer-Name (leer = aus dem Link)"
        required: false
        default: ""

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet yt-dlp pillow
      - name: Clip laden und schneiden
        env:
          LINK: ${{ inputs.link }}
          HOOK: ${{ inputs.hook }}
          STREAMER: ${{ inputs.streamer }}
        run: |
          mkdir -p raw fertig
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "raw/clip.%(ext)s" "$LINK"
          if [ -z "$STREAMER" ]; then
            STREAMER=$(echo "$LINK" | sed -E 's#.*twitch\.tv/([^/]+)/clip/.*#\1#')
            case "$STREAMER" in http*|*/*) STREAMER="" ;; esac
          fi
          TITLE=$(yt-dlp --no-playlist --print "%(title).50s" "$LINK" | tr -cd '[:alnum:] ._-' | tr ' ' '_')
          python cut.py raw/clip.mp4 "fertig/${STREAMER:-clip}_${TITLE:-clip}.mp4" "$HOOK" "$STREAMER"
          ls -la fertig
      - uses: actions/upload-artifact@v4
        with:
          name: fertiger-clip
          path: fertig/
          retention-days: 3
