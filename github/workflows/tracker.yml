name: Clipgang Tracker

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Twitch-Daten sammeln
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python tracker.py
      - name: Daten speichern
        run: |
          git config user.name "clipgang-bot"
          git config user.email "clipgang-bot@users.noreply.github.com"
          git add data REPORT.md
          git diff --cached --quiet || git commit -m "Tracker-Update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
